[tool.poetry]
name = "legacy-dev-next-to-group-dev"
version = "0.1.0"
description = "OXDEV-109396 autofix testbed: legacy dev-dependencies next to a group.dev table"
authors = ["OX Security <research@ox.security>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
requests = "^2.31"

[tool.poetry.dev-dependencies]
pytest = "^6.2"
pytest-runner = "^5.3"
parliament = "^1.4.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
