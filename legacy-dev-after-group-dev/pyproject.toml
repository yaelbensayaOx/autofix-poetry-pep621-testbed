[tool.poetry]
name = "legacy-dev-after-group-dev"
version = "0.1.0"
description = "OXDEV-109396 autofix testbed: legacy dev-dependencies after a group.dev table"
authors = ["OX Security <research@ox.security>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
