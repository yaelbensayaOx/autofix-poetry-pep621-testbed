[tool.poetry]
name = "legacy-dev-conflicting-pin"
version = "0.1.0"
description = "OXDEV-109396 autofix testbed: legacy dev-dependencies next to a group.dev table, upgrade blocked by an old black pin"
authors = ["OX Security <research@ox.security>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
markupsafe = "2.0.1"
keyring = "23.9.0"
slacker = "^0.14.0"
boto3 = "^1.26.95"
prompt-toolkit = "^3.0.39"
rich = "^13.5.2"

[tool.poetry.group.dev.dependencies]
coverage = "^7.0"

[tool.poetry.dev-dependencies]
pre-commit = "^2.2.0"
isort = "^4.3.21"
black = "^20.8b1"
mypy = "^1.3"
pydocstyle = "^5.0.2"
pytest = "^7.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
